name: DuckDB oracle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - name: Verify the fixture generator reproduces the checked-in bytes
        run: |
          python examples/seed/generate.py
          status=0
          relfence check --manifest examples/seed/l2.manifest.json --out examples/seed/l2.witness.json || status=$?
          test "$status" -eq 1
          git diff --exit-code -- examples/seed
